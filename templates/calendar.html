{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="/static/css/calendar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="calendar-container">
    <div class="calendar-wrapper">
        <!-- Header Profesional -->
        <div class="calendar-header">
            <div class="header-content">
                <h2 class="calendar-title">
                    <i class="fas fa-calendar-alt"></i>
                    Calendario de Escaneos
                </h2>
                <p class="calendar-subtitle">Programa y revisa tus escaneos de seguridad</p>
            </div>
        </div>

        <!-- Calendario Principal -->
        <div class="calendar-main">
            <div id="calendar"></div>
        </div>

        <!-- Leyenda -->
        <div class="calendar-legend">
            <h4 class="legend-title">
                <i class="fas fa-info-circle"></i>
                Leyenda
            </h4>
            <div class="legend-items">
                <div class="legend-item">
                    <div class="legend-color completed"></div>
                    <span class="legend-text">
                        <strong>Escaneos Completados</strong>
                        <small>Escaneos finalizados con resultados disponibles</small>
                    </span>
                </div>
                <div class="legend-item">
                    <div class="legend-color scheduled"></div>
                    <span class="legend-text">
                        <strong>Escaneos Programados</strong>
                        <small>Escaneos pendientes de ejecución</small>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Original -->
<div class="modal fade" id="eventDetailsModal" tabindex="-1" aria-labelledby="eventDetailsLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventDetailsLabel">Event Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="eventDetailsContent">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/index.global.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script src="/static/js/calendar.js"></script>
{% endblock %}
